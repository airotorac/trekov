<!doctype html><meta charset="utf-8">
<body style="margin:0;background:#0B0F0E;color:#8FA39C;font:13px system-ui;padding:24px">
<div style="display:flex;gap:60px;align-items:center;justify-content:center;margin-bottom:28px"><div id="bigcar"></div><div id="bigbike"></div></div>
<div id="grid" style="display:grid;grid-template-columns:auto repeat(8,1fr);gap:10px 14px;align-items:center;justify-items:center"></div>
<script type="module">
import { vehicleSvg, COLOURS } from '/src/lib/vehicleArt.js'
bigcar.innerHTML = vehicleSvg('car', {colour:'red', size:170, id:'bc'})
bigbike.innerHTML = vehicleSvg('bike', {colour:'blue', size:170, id:'bb'})
let h = '<span></span>' + COLOURS.map(c=>`<span>${c.label}</span>`).join('')
for (const k of ['car','bike']) h += `<span>${k}</span>` + COLOURS.map(c=>vehicleSvg(k,{colour:c.id,size:64,id:k+c.id})).join('')
h += '<span>28px</span>' + COLOURS.map(c=>vehicleSvg('car',{colour:c.id,size:28,id:'s'+c.id})).join('')
grid.innerHTML = h
</script>
